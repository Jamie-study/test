<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>간호 공부 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8F1; --ink:#4A3F55; --soft:#8C8199; --line:#EFE4F0; --white:#fff;
  --med:#FFD9E3; --med-d:#E2668C; --med-l:#FFF0F4;
  --ana:#CFF3E3; --ana-d:#2E9C77; --ana-l:#EEFBF5;
  --nur:#E4DCFF; --nur-d:#7A5FD8; --nur-l:#F4F0FF;
  --c:var(--med); --cd:var(--med-d); --cl:var(--med-l);
  --ok:#3DB487; --bad:#F06C7F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,sans-serif;font-size:16px;line-height:1.55}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background-image:radial-gradient(circle at 10% 0%,#FFE6EE 0,transparent 35%),radial-gradient(circle at 100% 20%,#E6F7FF 0,transparent 30%),radial-gradient(circle at 0% 100%,#EFE8FF 0,transparent 35%);background-attachment:fixed;min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:16px 16px 90px}
h1,h2,h3,.jua{font-family:"Jua",sans-serif;font-weight:400;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-height:44px}
.back{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:0 2px 0 var(--line);font-size:20px;display:grid;place-items:center;flex:none}
.topbar h1{font-size:22px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--white);color:var(--soft);flex:none;white-space:nowrap}
.save.warn{background:#FFF1D6;color:#A86A00}
.hello{margin:6px 2px 18px}
.hello h1{font-size:28px;line-height:1.25}
.hello p{margin:4px 0 0;color:var(--soft)}
.subj{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px;border-radius:24px;background:var(--c);margin-bottom:14px;box-shadow:0 4px 0 rgba(0,0,0,.05);transition:transform .12s}
.subj:active{transform:scale(.98)}
.subj .emo{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:30px;flex:none}
.subj h2{font-size:22px}
.subj small{color:var(--ink);opacity:.7;display:block}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.7);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cd);border-radius:9px;transition:width .3s}
.t-med{--c:var(--med);--cd:var(--med-d);--cl:var(--med-l)}
.t-ana{--c:var(--ana);--cd:var(--ana-d);--cl:var(--ana-l)}
.t-nur{--c:var(--nur);--cd:var(--nur-d);--cl:var(--nur-l)}
.chap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;background:var(--white);margin-bottom:10px;box-shadow:0 3px 0 var(--line)}
.chap .num{width:40px;height:40px;border-radius:14px;background:var(--c);color:var(--cd);display:grid;place-items:center;font-family:Jua;font-size:18px;flex:none}
.chap b{font-weight:400;font-family:Jua;font-size:17px;display:block}
.chap small{color:var(--soft);font-size:13px}
.chap .go{margin-left:auto;color:var(--cd);font-size:20px}
.add{width:100%;padding:14px;border-radius:20px;border:2px dashed var(--cd);color:var(--cd);background:var(--cl);font-family:Jua;font-size:17px}
.tabs{display:flex;gap:6px;background:var(--white);padding:6px;border-radius:18px;margin-bottom:14px;box-shadow:0 3px 0 var(--line);position:sticky;top:8px;z-index:5}
.tabs button{flex:1;padding:10px 4px;border-radius:13px;font-family:Jua;font-size:16px;color:var(--soft)}
.tabs button.on{background:var(--c);color:var(--cd)}
.panel{background:var(--white);border-radius:22px;padding:16px;box-shadow:0 3px 0 var(--line)}
.hint{color:var(--soft);font-size:13px;margin:0 0 8px}
textarea.sum{width:100%;min-height:55vh;border:0;outline:0;resize:none;background:repeating-linear-gradient(var(--white),var(--white) 31px,var(--line) 31px,var(--line) 32px);line-height:32px;padding:0 2px}
.flipwrap{perspective:1200px;margin:4px 0 12px}
.flip{position:relative;width:100%;height:230px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1);cursor:pointer}
.flip.turned{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;overflow:auto}
.front{background:var(--c)}
.back-face{background:var(--cl);border:3px solid var(--c);transform:rotateY(180deg)}
.face .lbl{position:absolute;top:12px;left:16px;font-size:12px;color:var(--cd);opacity:.8}
.face .big{font-family:Jua;font-size:28px;line-height:1.3;word-break:keep-all}
.face .mid{font-size:19px;word-break:keep-all;white-space:pre-wrap}
.face .tap{position:absolute;bottom:10px;font-size:12px;color:var(--soft)}
.star{position:absolute;top:8px;right:10px;font-size:22px}
.row{display:flex;gap:8px;align-items:center}
.row.c{justify-content:center}
.pill{padding:10px 14px;border-radius:14px;background:var(--cl);color:var(--cd);font-family:Jua;font-size:15px}
.pill.main{background:var(--cd);color:#fff}
.pill.ghost{background:transparent;border:2px solid var(--line);color:var(--soft)}
.pill:disabled{opacity:.4}
.count{font-family:Jua;color:var(--soft);min-width:60px;text-align:center}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--soft);margin:10px 0 0;justify-content:center}
.toggle input{width:18px;height:18px;accent-color:var(--cd)}
.sec{font-family:Jua;font-size:18px;margin:22px 4px 10px;display:flex;align-items:center;justify-content:space-between}
.card-item{display:flex;gap:10px;align-items:flex-start;padding:12px 4px;border-bottom:1px dashed var(--line)}
.card-item:last-child{border-bottom:0}
.card-item .tx{flex:1;min-width:0}
.card-item b{font-family:Jua;font-weight:400;font-size:16px;display:block;word-break:keep-all}
.card-item span{color:var(--soft);font-size:14px;white-space:pre-wrap;word-break:keep-all}
.ico{width:36px;height:36px;border-radius:12px;background:var(--cl);display:grid;place-items:center;flex:none;font-size:15px}
.field{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 12px;outline:0;background:#fff;margin-bottom:8px}
.field:focus{border-color:var(--cd)}
textarea.field{resize:vertical;min-height:70px}
.empty{text-align:center;color:var(--soft);padding:26px 10px}
.empty .e{font-size:40px;display:block;margin-bottom:6px}
.q-top{display:flex;justify-content:space-between;color:var(--soft);font-size:14px;margin-bottom:8px}
.q-prog{height:8px;background:var(--cl);border-radius:9px;overflow:hidden;margin-bottom:16px}
.q-prog i{display:block;height:100%;background:var(--cd);transition:width .3s}
.q-ask{font-size:13px;color:var(--soft);margin-bottom:4px}
.q-q{font-family:Jua;font-size:24px;line-height:1.35;margin-bottom:16px;word-break:keep-all;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:16px;background:var(--bg);border:2px solid var(--line);margin-bottom:9px;font-size:16px;word-break:keep-all;white-space:pre-wrap}
.opt.right{background:#E2F7EE;border-color:var(--ok)}
.opt.wrong{background:#FFE6EA;border-color:var(--bad)}
.opt:disabled{color:var(--ink)}
.feedback{font-family:Jua;font-size:18px;margin:6px 0 12px;text-align:center}
.score{text-align:center;padding:10px 0}
.score .n{font-family:Jua;font-size:56px;color:var(--cd);line-height:1}
.choice{display:flex;gap:8px;margin:8px 0 14px}
.choice button{flex:1;padding:12px 6px;border-radius:14px;border:2px solid var(--line);font-size:14px}
.choice button.on{border-color:var(--cd);background:var(--cl);color:var(--cd);font-family:Jua;font-size:15px}
.modal-bg{position:fixed;inset:0;background:rgba(74,63,85,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
.modal{background:#fff;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s}
.modal h3{font-size:20px;margin-bottom:12px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px)}}
.menu-btn{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:0 2px 0 var(--line);font-size:18px;flex:none}
.foot{text-align:center;color:var(--soft);font-size:12px;margin-top:26px}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.08)}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="modal-root"></div>
<script>
(function(){
const SUBJ_META = {
  med:{name:"의학용어", emo:"📖", desc:"어근·접두사·접미사"},
  ana:{name:"해부생리", emo:"🫀", desc:"몸의 구조와 기능"},
  nur:{name:"기본간호학", emo:"🩺", desc:"간호의 기본 기술"}
};
const ORDER = ["med","ana","nur"];
let uidCounter = 0;
const uid = () => Date.now().toString(36) + (uidCounter++).toString(36) + Math.random().toString(36).slice(2,6);
const c = (t,m) => ({id:uid(), t, m, known:false});
const ch = (title, cards) => ({id:uid(), title, summary:"", cards:cards||[], best:null});

function defaults(){
  return {
    med:{chapters:[
      ch("1단원 용어의 구조", [
        c("cardi/o","심장"), c("hepat/o","간"), c("nephr/o","콩팥(신장)"), c("gastr/o","위"),
        c("-itis","염증"), c("-ectomy","절제술 (잘라내는 수술)"), c("-algia","통증"),
        c("brady-","느린"), c("tachy-","빠른"), c("hypo-","아래, 부족한")
      ]),
      ch("2단원 심혈관계"), ch("3단원 호흡기계"), ch("4단원 소화기계")
    ]},
    ana:{chapters:[
      ch("1단원 세포와 조직", [
        c("미토콘드리아","세포 안에서 에너지(ATP)를 만드는 곳"),
        c("리보솜","단백질을 만드는 곳"),
        c("4대 조직","상피조직 · 결합조직 · 근육조직 · 신경조직")
      ]),
      ch("2단원 뼈대계통"), ch("3단원 심장혈관계통"), ch("4단원 호흡계통")
    ]},
    nur:{chapters:[
      ch("1단원 활력징후", [
        c("활력징후 (V/S)","체온 · 맥박 · 호흡 · 혈압"),
        c("서맥 (bradycardia)","성인 맥박이 분당 60회 미만"),
        c("빈맥 (tachycardia)","성인 맥박이 분당 100회 초과"),
        c("무호흡 (apnea)","호흡이 멈춘 상태")
      ]),
      ch("2단원 감염관리"), ch("3단원 투약"), ch("4단원 위생과 안위")
    ]}
  };
}

let data = null;
let view = {name:"home"};
let cardState = {idx:0, turned:false, onlyUnknown:false, order:null};
let quiz = null;
let saveMsg = "이 기기에 저장됨 ✓", saveWarn = false;

/* ---------- storage ---------- */
let db = null, userId = null, useCloud = false;
const LS_KEY = "nurse-study-v1";
const saving = {}, pending = {}, timers = {};

function lsGet(){ try{ const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function lsSet(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){} }

function docRef(sid){ return db.doc("data/users/" + userId + "/subj-" + sid); }

function markDirty(sid){
  lsSet();
  if(!useCloud){ setSave(lsOK ? "이 기기에 저장됨 ✓" : "저장이 안 돼요", !lsOK); return; }
  setSave("저장 중…");
  clearTimeout(timers[sid]);
  timers[sid] = setTimeout(()=>saveSubject(sid), 900);
}
async function saveSubject(sid){
  if(saving[sid]){ pending[sid] = true; return; }
  saving[sid] = true;
  try{
    await docRef(sid).set({v:1, json:JSON.stringify(data[sid])});
    setSave("저장됨 ✓");
  }catch(e){
    const code = e && e.code;
    if(code === "unavailable"){
      setSave("다시 저장 시도 중…", true);
      setTimeout(()=>saveSubject(sid), 1500 + Math.random()*1000);
    } else if(code === "quota_exceeded"){
      setSave("저장 공간이 꽉 찼어요", true);
    } else {
      useCloud = false;
      setSave("이 기기에만 저장 중", true);
    }
  }finally{
    saving[sid] = false;
    if(pending[sid]){ pending[sid] = false; saveSubject(sid); }
  }
}
function setSave(msg, warn){
  saveMsg = msg; saveWarn = !!warn;
  const el = document.getElementById("save");
  if(el){ el.textContent = msg; el.className = "save" + (saveWarn ? " warn" : ""); }
}
let lsOK = true;
try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ lsOK = false; }

function normalize(d){
  const base = defaults();
  const out = {};
  ORDER.forEach(sid=>{
    const s = d && d[sid] && Array.isArray(d[sid].chapters) ? d[sid] : base[sid];
    out[sid] = {chapters:s.chapters.map(x=>({id:x.id||uid(), title:String(x.title||"새 단원"), summary:String(x.summary||""),
      cards:Array.isArray(x.cards)?x.cards.map(k=>({id:k.id||uid(), t:String(k.t||""), m:String(k.m||""), known:!!k.known})):[],
      best:typeof x.best==="number"?x.best:null}))};
  });
  return out;
}

async function init(){
  data = normalize(lsGet());
  render();
  let finished = false;
  const timer = setTimeout(()=>{ if(!finished){ setSave(lsOK ? "이 기기에 저장 중" : "저장 안 됨", true); } }, 10000);
  try{
    if(!window.claude || !window.claude.use){ throw 0; }
    const [dbNs, userNs] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!dbNs || !userNs) throw 0;
    const id = await userNs.id();
    if(!id) throw 0;
    db = dbNs; userId = id;
    const snaps = await Promise.all(ORDER.map(sid=>docRef(sid).get()));
    const cloud = {};
    let any = false;
    snaps.forEach((s,i)=>{
      if(s && s.exists){
        const body = s.data();
        try{ cloud[ORDER[i]] = JSON.parse(body.json); any = true; }catch(e){}
      }
    });
    finished = true; clearTimeout(timer);
    useCloud = true;
    if(any){
      const merged = {};
      ORDER.forEach(sid=>{ merged[sid] = cloud[sid] || data[sid]; });
      data = normalize(merged);
      lsSet();
      setSave("저장됨 ✓");
      fixView(); render();
    } else {
      // first time: push whatever we have (local or defaults)
      setSave("저장 중…");
      for(const sid of ORDER){ await saveSubject(sid); }
    }
  }catch(e){
    finished = true; clearTimeout(timer);
    useCloud = false;
    setSave(lsOK ? "이 기기에 저장됨 ✓" : "저장이 안 돼요", !lsOK);
  }
}
function fixView(){
  if(view.sid && !data[view.sid]) view = {name:"home"};
  if(view.cid && !getChap()) view = {name:"subject", sid:view.sid};
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function getChap(){ const s = data[view.sid]; return s && s.chapters.find(x=>x.id===view.cid); }
function go(v){ view = v; quiz = null; cardState = {idx:0, turned:false, onlyUnknown:false, order:null}; render(); window.scrollTo(0,0); }

/* ---------- modal ---------- */
function modal(html, onMount){
  const root = document.getElementById("modal-root");
  root.innerHTML = '<div class="modal-bg"><div class="modal">'+html+'</div></div>';
  const bg = root.firstChild;
  bg.addEventListener("click", e=>{ if(e.target===bg) closeModal(); });
  onMount && onMount(bg.firstChild);
}
function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }
function askText(title, value, placeholder, cb){
  modal('<h3>'+esc(title)+'</h3><input class="field" id="m-in" placeholder="'+esc(placeholder||"")+'" value="'+esc(value||"")+'"><div class="row" style="justify-content:flex-end"><button class="pill ghost" id="m-no">취소</button><button class="pill main" id="m-ok">확인</button></div>', m=>{
    const inp = m.querySelector("#m-in"); setTimeout(()=>inp.focus(), 50);
    const ok = ()=>{ const v = inp.value.trim(); if(!v) return; closeModal(); cb(v); };
    m.querySelector("#m-ok").onclick = ok;
    inp.onkeydown = e=>{ if(e.key==="Enter") ok(); };
    m.querySelector("#m-no").onclick = closeModal;
  });
}
function askConfirm(title, msg, okLabel, cb){
  modal('<h3>'+esc(title)+'</h3><p class="hint" style="font-size:15px">'+esc(msg)+'</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="pill ghost" id="m-no">취소</button><button class="pill main" id="m-ok" style="background:var(--bad)">'+esc(okLabel)+'</button></div>', m=>{
    m.querySelector("#m-ok").onclick = ()=>{ closeModal(); cb(); };
    m.querySelector("#m-no").onclick = closeModal;
  });
}

/* ---------- render ---------- */
function topbar(title, backTo, extra){
  return '<div class="topbar">'+(backTo?'<button class="back" id="back" aria-label="뒤로">←</button>':'')+
    '<h1>'+esc(title)+'</h1>'+(extra||'')+'<span id="save" class="save'+(saveWarn?' warn':'')+'">'+esc(saveMsg)+'</span></div>';
}
function stats(sid){
  let total=0, known=0;
  data[sid].chapters.forEach(x=>{ total+=x.cards.length; known+=x.cards.filter(k=>k.known).length; });
  return {total, known, pct: total? Math.round(known/total*100):0};
}

function render(){
  const app = document.getElementById("app");
  document.body.className = view.sid ? "t-"+view.sid : "";
  if(view.name==="home") return renderHome(app);
  if(view.name==="subject") return renderSubject(app);
  if(view.name==="chapter") return renderChapter(app);
}

function renderHome(app){
  const h = new Date().getHours();
  const greet = h<12 ? "좋은 아침이에요 ☀️" : h<18 ? "오늘도 화이팅 🌷" : "오늘 하루 수고했어요 🌙";
  let html = '<div class="topbar"><div style="flex:1"></div><span id="save" class="save'+(saveWarn?' warn':'')+'">'+esc(saveMsg)+'</span></div>';
  html += '<div class="hello"><h1>'+greet+'</h1><p>어떤 과목부터 볼까요?</p></div>';
  ORDER.forEach(sid=>{
    const m = SUBJ_META[sid], st = stats(sid), n = data[sid].chapters.length;
    html += '<button class="subj t-'+sid+'" data-sid="'+sid+'"><span class="emo">'+m.emo+'</span><span style="flex:1;min-width:0"><h2>'+m.name+'</h2><small>'+n+'개 단원 · 카드 '+st.total+'장 · 외운 카드 '+st.pct+'%</small><div class="bar"><i style="width:'+st.pct+'%"></i></div></span></button>';
  });
  html += '<div class="row" style="margin-top:18px"><button class="pill ghost" style="flex:1" id="bk">💾 백업 파일 받기</button><button class="pill ghost" style="flex:1" id="rs">📂 백업 불러오기</button></div><input type="file" id="rsf" accept=".json,application/json" style="display:none">';
  html += '<p class="foot">기록은 이 기기의 이 브라우저에 자동 저장돼요.<br>폰을 바꾸거나 브라우저 기록을 지우기 전에 백업해 두세요.</p>';
  app.innerHTML = html;
  app.querySelector("#bk").onclick = ()=>{
    const blob = new Blob([JSON.stringify({app:"nurse-study", v:1, data})], {type:"application/json"});
    const a = document.createElement("a"); const d = new Date();
    a.href = URL.createObjectURL(blob); a.download = "공부노트_백업_"+d.getFullYear()+(d.getMonth()+1+"").padStart(2,"0")+(d.getDate()+"").padStart(2,"0")+".json";
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  const rsf = app.querySelector("#rsf");
  app.querySelector("#rs").onclick = ()=>rsf.click();
  rsf.onchange = ()=>{
    const f = rsf.files[0]; if(!f) return;
    f.text().then(t=>{
      let j; try{ j = JSON.parse(t); }catch(e){ j = null; }
      if(!j || !j.data){ askConfirm("불러올 수 없어요", "이 앱에서 받은 백업 파일이 맞는지 확인해 주세요.", "닫기", ()=>{}); return; }
      askConfirm("백업을 불러올까요?", "지금 기록이 백업 파일 내용으로 바뀌어요.", "불러오기", ()=>{
        data = normalize(j.data); ORDER.forEach(sid=>markDirty(sid)); render();
      });
    });
  };
  app.querySelectorAll(".subj").forEach(b=>b.onclick=()=>go({name:"subject", sid:b.dataset.sid}));
}

function renderSubject(app){
  const sid = view.sid, m = SUBJ_META[sid], s = data[sid];
  let html = topbar(m.emo+" "+m.name, true);
  if(!s.chapters.length) html += '<div class="empty"><span class="e">🌱</span>아직 단원이 없어요. 아래에서 추가해 주세요!</div>';
  s.chapters.forEach((x,i)=>{
    const known = x.cards.filter(k=>k.known).length;
    const bits = [];
    bits.push(x.summary.trim() ? "요약 ✏️" : "요약 없음");
    bits.push("카드 "+known+"/"+x.cards.length);
    if(x.best!==null) bits.push("퀴즈 최고 "+x.best+"점");
    html += '<button class="chap" data-cid="'+x.id+'"><span class="num">'+(i+1)+'</span><span style="min-width:0"><b>'+esc(x.title)+'</b><small>'+bits.join(" · ")+'</small></span><span class="go">›</span></button>';
  });
  html += '<button class="add" id="addch">+ 단원 추가</button>';
  app.innerHTML = html;
  app.querySelector("#back").onclick = ()=>go({name:"home"});
  app.querySelectorAll(".chap").forEach(b=>b.onclick=()=>go({name:"chapter", sid, cid:b.dataset.cid, tab:"sum"}));
  app.querySelector("#addch").onclick = ()=>askText("새 단원 이름", (s.chapters.length+1)+"단원 ", "예) 5단원 비뇨기계", v=>{
    s.chapters.push(ch(v)); markDirty(sid); render();
  });
}

function renderChapter(app){
  const sid = view.sid, x = getChap();
  if(!x){ return go({name:"subject", sid}); }
  let html = topbar(x.title, true, '<button class="menu-btn" id="menu" aria-label="단원 설정">⋯</button>');
  html += '<div class="tabs">'+[["sum","✏️ 요약"],["card","🃏 카드"],["quiz","💯 퀴즈"]].map(t=>'<button data-tab="'+t[0]+'" class="'+(view.tab===t[0]?"on":"")+'">'+t[1]+'</button>').join("")+'</div>';
  html += '<div id="body"></div>';
  app.innerHTML = html;
  app.querySelector("#back").onclick = ()=>go({name:"subject", sid});
  app.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ view.tab=b.dataset.tab; quiz=null; renderChapter(app); });
  app.querySelector("#menu").onclick = ()=>chapterMenu(sid, x);
  const body = app.querySelector("#body");
  if(view.tab==="sum") renderSummary(body, sid, x);
  else if(view.tab==="card") renderCards(body, sid, x);
  else renderQuiz(body, sid, x);
}

function chapterMenu(sid, x){
  const s = data[sid], i = s.chapters.indexOf(x);
  modal('<h3>단원 설정</h3>'+
    '<button class="pill" style="width:100%;margin-bottom:8px" id="r">✏️ 이름 바꾸기</button>'+
    '<div class="row" style="margin-bottom:8px"><button class="pill" style="flex:1" id="up" '+(i===0?"disabled":"")+'>↑ 위로</button><button class="pill" style="flex:1" id="dn" '+(i===s.chapters.length-1?"disabled":"")+'>↓ 아래로</button></div>'+
    '<button class="pill" style="width:100%;margin-bottom:8px;background:#FFE6EA;color:var(--bad)" id="d">🗑 단원 삭제</button>'+
    '<button class="pill ghost" style="width:100%" id="c">닫기</button>', m=>{
    m.querySelector("#c").onclick = closeModal;
    m.querySelector("#r").onclick = ()=>{ closeModal(); askText("단원 이름 바꾸기", x.title, "", v=>{ x.title=v; markDirty(sid); render(); }); };
    m.querySelector("#up").onclick = ()=>{ s.chapters.splice(i,1); s.chapters.splice(i-1,0,x); markDirty(sid); closeModal(); render(); };
    m.querySelector("#dn").onclick = ()=>{ s.chapters.splice(i,1); s.chapters.splice(i+1,0,x); markDirty(sid); closeModal(); render(); };
    m.querySelector("#d").onclick = ()=>{ closeModal(); askConfirm("단원을 삭제할까요?", "'"+x.title+"'의 요약과 카드 "+x.cards.length+"장이 모두 지워지고 되돌릴 수 없어요.", "삭제", ()=>{
      s.chapters = s.chapters.filter(y=>y!==x); markDirty(sid); go({name:"subject", sid});
    }); };
  });
}

/* ----- summary ----- */
function renderSummary(body, sid, x){
  body.innerHTML = '<div class="panel"><p class="hint">수업 듣고 정리한 내용을 자유롭게 적어요. 쓰는 대로 자동 저장돼요.</p><textarea class="sum" id="sum" placeholder="예)\n• 오늘 배운 핵심 3가지\n• 헷갈리는 부분\n• 시험에 나온다고 한 것 ⭐"></textarea></div>';
  const ta = body.querySelector("#sum");
  ta.value = x.summary;
  const grow = ()=>{ ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight, window.innerHeight*0.55)+"px"; };
  ta.addEventListener("input", ()=>{ x.summary = ta.value; grow(); markDirty(sid); });
  setTimeout(grow, 0);
}

/* ----- cards ----- */
function deck(x){
  let list = x.cards;
  if(cardState.onlyUnknown) list = list.filter(k=>!k.known);
  if(cardState.order){
    const map = new Map(list.map(k=>[k.id,k]));
    const ordered = cardState.order.map(id=>map.get(id)).filter(Boolean);
    list.forEach(k=>{ if(!cardState.order.includes(k.id)) ordered.push(k); });
    list = ordered;
  }
  return list;
}
function renderCards(body, sid, x){
  const list = deck(x);
  if(cardState.idx >= list.length) cardState.idx = Math.max(0, list.length-1);
  const cur = list[cardState.idx];
  const known = x.cards.filter(k=>k.known).length;
  let html = '';
  if(!x.cards.length){
    html += '<div class="panel empty"><span class="e">🃏</span>아직 카드가 없어요.<br>아래에서 중요한 용어를 추가해 보세요!</div>';
  } else if(!cur){
    html += '<div class="panel empty"><span class="e">🎉</span>모르는 카드가 하나도 없어요!<br>다 외웠네요. 정말 잘했어요!</div>';
  } else {
    html += '<div class="flipwrap"><div class="flip'+(cardState.turned?" turned":"")+'" id="flip">'+
      '<div class="face front"><span class="lbl">용어</span><button class="star" id="star" aria-label="외웠어요 표시">'+(cur.known?"⭐":"☆")+'</button><div class="big">'+esc(cur.t)+'</div><span class="tap">눌러서 뒤집기</span></div>'+
      '<div class="face back-face"><span class="lbl">뜻</span><div class="mid">'+esc(cur.m)+'</div><span class="tap">다시 누르면 앞면</span></div>'+
      '</div></div>';
    html += '<div class="row c"><button class="pill" id="prev" '+(cardState.idx===0?"disabled":"")+'>‹ 이전</button><span class="count">'+(cardState.idx+1)+' / '+list.length+'</span><button class="pill" id="next" '+(cardState.idx>=list.length-1?"disabled":"")+'>다음 ›</button></div>';
    html += '<div class="row c" style="margin-top:10px"><button class="pill '+(cur.known?"ghost":"main")+'" id="know">'+(cur.known?"다시 볼래요":"외웠어요 ⭐")+'</button><button class="pill ghost" id="shuf">🔀 섞기</button></div>';
  }
  if(x.cards.length) html += '<label class="toggle"><input type="checkbox" id="only" '+(cardState.onlyUnknown?"checked":"")+'> 아직 못 외운 카드만 보기 ('+(x.cards.length-known)+'장)</label>';
  html += '<div class="sec"><span>카드 목록 ('+x.cards.length+')</span><span style="font-size:14px;color:var(--soft)">외움 '+known+'</span></div>';
  html += '<div class="panel" style="margin-bottom:12px"><input class="field" id="nt" placeholder="용어  예) -itis"><textarea class="field" id="nm" placeholder="뜻  예) 염증" style="min-height:56px"></textarea><button class="pill main" style="width:100%" id="addc">+ 카드 추가</button></div>';
  if(x.cards.length){
    html += '<div class="panel">'+x.cards.map(k=>'<div class="card-item" data-id="'+k.id+'"><span style="width:20px">'+(k.known?"⭐":"")+'</span><div class="tx"><b>'+esc(k.t)+'</b><span>'+esc(k.m)+'</span></div><button class="ico" data-act="edit" aria-label="수정">✏️</button><button class="ico" data-act="del" aria-label="삭제">🗑</button></div>').join("")+'</div>';
  }
  body.innerHTML = html;

  const rerender = ()=>renderCards(body, sid, x);
  if(cur){
    body.querySelector("#flip").onclick = e=>{ if(e.target.closest("#star")) return; cardState.turned=!cardState.turned; body.querySelector("#flip").classList.toggle("turned", cardState.turned); };
    const toggleKnown = ()=>{ cur.known=!cur.known; markDirty(sid); if(cardState.onlyUnknown && cur.known){ cardState.turned=false; } rerender(); };
    body.querySelector("#star").onclick = toggleKnown;
    body.querySelector("#know").onclick = ()=>{ const was = cur.known; cur.known=!cur.known; markDirty(sid);
      if(!was && !cardState.onlyUnknown && cardState.idx < list.length-1) cardState.idx++;
      cardState.turned=false; rerender(); };
    body.querySelector("#prev").onclick = ()=>{ cardState.idx--; cardState.turned=false; rerender(); };
    body.querySelector("#next").onclick = ()=>{ cardState.idx++; cardState.turned=false; rerender(); };
    body.querySelector("#shuf").onclick = ()=>{ cardState.order = shuffle(x.cards.map(k=>k.id)); cardState.idx=0; cardState.turned=false; rerender(); };
    // swipe
    let sx=null;
    const fl = body.querySelector("#flip");
    fl.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; }, {passive:true});
    fl.addEventListener("touchend", e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null;
      if(Math.abs(dx)>60){ if(dx<0 && cardState.idx<list.length-1){cardState.idx++;} else if(dx>0 && cardState.idx>0){cardState.idx--;} else return; cardState.turned=false; rerender(); } });
  }
  const only = body.querySelector("#only");
  if(only) only.onchange = ()=>{ cardState.onlyUnknown=only.checked; cardState.idx=0; cardState.turned=false; rerender(); };
  body.querySelector("#addc").onclick = ()=>{
    const t = body.querySelector("#nt").value.trim(), m = body.querySelector("#nm").value.trim();
    if(!t || !m){ (t?body.querySelector("#nm"):body.querySelector("#nt")).focus(); return; }
    x.cards.push(c(t,m)); markDirty(sid);
    rerender();
    const nt = body.querySelector("#nt"); nt.focus();
  };
  body.querySelectorAll(".card-item .ico").forEach(b=>b.onclick=()=>{
    const id = b.closest(".card-item").dataset.id, k = x.cards.find(y=>y.id===id);
    if(!k) return;
    if(b.dataset.act==="del"){
      askConfirm("카드를 삭제할까요?", "'"+k.t+"' 카드가 지워져요.", "삭제", ()=>{ x.cards = x.cards.filter(y=>y!==k); markDirty(sid); rerender(); });
    } else {
      modal('<h3>카드 수정</h3><input class="field" id="et" value="'+esc(k.t)+'"><textarea class="field" id="em">'+esc(k.m)+'</textarea><div class="row" style="justify-content:flex-end"><button class="pill ghost" id="m-no">취소</button><button class="pill main" id="m-ok">저장</button></div>', m=>{
        m.querySelector("#m-no").onclick = closeModal;
        m.querySelector("#m-ok").onclick = ()=>{ const t=m.querySelector("#et").value.trim(), mm=m.querySelector("#em").value.trim(); if(!t||!mm) return; k.t=t; k.m=mm; markDirty(sid); closeModal(); rerender(); };
      });
    }
  });
}

/* ----- quiz ----- */
let quizDir = "tm";
function renderQuiz(body, sid, x){
  if(!quiz) return quizStart(body, sid, x);
  if(quiz.i >= quiz.qs.length) return quizEnd(body, sid, x);
  const q = quiz.qs[quiz.i];
  const ask = quiz.dir==="tm" ? "이 용어의 뜻은?" : "이 뜻에 맞는 용어는?";
  let html = '<div class="panel"><div class="q-top"><span>'+(quiz.i+1)+' / '+quiz.qs.length+'</span><span>맞힌 개수 '+quiz.score+'</span></div>'+
    '<div class="q-prog"><i style="width:'+(quiz.i/quiz.qs.length*100)+'%"></i></div>'+
    '<div class="q-ask">'+ask+'</div><div class="q-q">'+esc(q.prompt)+'</div>';
  q.opts.forEach((o,i)=>{
    let cls = "opt";
    if(q.picked!==null){ if(o.id===q.answer) cls+=" right"; else if(i===q.picked) cls+=" wrong"; }
    html += '<button class="'+cls+'" data-i="'+i+'" '+(q.picked!==null?"disabled":"")+'>'+esc(o.text)+'</button>';
  });
  if(q.picked!==null){
    const ok = q.opts[q.picked].id===q.answer;
    html += '<div class="feedback pop" style="color:'+(ok?"var(--ok)":"var(--bad)")+'">'+(ok?"정답! 🎉":"아쉬워요! 초록색이 정답이에요")+'</div>';
    html += '<button class="pill main" style="width:100%" id="nx">'+(quiz.i===quiz.qs.length-1?"결과 보기":"다음 문제 →")+'</button>';
  }
  html += '</div>';
  body.innerHTML = html;
  body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i = +b.dataset.i; q.picked = i;
    if(q.opts[i].id===q.answer) quiz.score++; else quiz.wrong.push(q.card);
    renderQuiz(body, sid, x);
  });
  const nx = body.querySelector("#nx");
  if(nx) nx.onclick = ()=>{ quiz.i++; renderQuiz(body, sid, x); window.scrollTo(0,0); };
}
function quizStart(body, sid, x){
  const n = x.cards.length;
  let html = '<div class="panel">';
  if(n < 2){
    html += '<div class="empty"><span class="e">💯</span>퀴즈는 카드가 2장 이상 있어야 만들 수 있어요.<br>카드 탭에서 용어를 먼저 추가해 주세요!</div>';
  } else {
    const cnt = Math.min(10, n);
    html += '<h3 style="font-size:20px;margin-bottom:4px">내 카드로 만드는 퀴즈</h3><p class="hint">이 단원 카드 '+n+'장 중 '+cnt+'문제를 무작위로 내요. 틀린 카드는 \'못 외운 카드\'로 다시 표시돼요.</p>';
    html += '<div class="choice"><button data-d="tm" class="'+(quizDir==="tm"?"on":"")+'">용어 보고<br>뜻 고르기</button><button data-d="mt" class="'+(quizDir==="mt"?"on":"")+'">뜻 보고<br>용어 고르기</button></div>';
    if(x.best!==null) html += '<p class="hint" style="text-align:center">지금까지 최고 점수: <b style="color:var(--cd)">'+x.best+'점</b></p>';
    html += '<button class="pill main" style="width:100%;padding:14px" id="st">퀴즈 시작!</button>';
  }
  html += '</div>';
  body.innerHTML = html;
  body.querySelectorAll(".choice button").forEach(b=>b.onclick=()=>{ quizDir=b.dataset.d; quizStart(body, sid, x); });
  const st = body.querySelector("#st");
  if(st) st.onclick = ()=>{ quiz = buildQuiz(sid, x, quizDir); renderQuiz(body, sid, x); };
}
function buildQuiz(sid, x, dir){
  const pool = x.cards;
  // extra distractors from same subject if chapter has few cards
  const extra = data[sid].chapters.filter(y=>y!==x).flatMap(y=>y.cards);
  const picks = shuffle(pool).slice(0, Math.min(10, pool.length));
  const field = dir==="tm" ? "m" : "t", pfield = dir==="tm" ? "t" : "m";
  const qs = picks.map(card=>{
    const seen = new Set([card[field].trim()]);
    const others = [];
    for(const k of shuffle(pool).concat(shuffle(extra))){
      if(others.length>=3) break;
      const v = k[field].trim();
      if(seen.has(v)) continue;
      seen.add(v); others.push({id:k.id, text:k[field]});
    }
    const opts = shuffle([{id:card.id, text:card[field]}].concat(others));
    return {card, prompt:card[pfield], answer:card.id, opts, picked:null};
  });
  return {qs, i:0, score:0, wrong:[], dir};
}
function quizEnd(body, sid, x){
  const total = quiz.qs.length, sc = Math.round(quiz.score/total*100);
  if(!quiz.saved){
    quiz.saved = true;
    quiz.wrong.forEach(k=>{ k.known=false; });
    if(x.best===null || sc > x.best) { x.best = sc; quiz.newBest = true; }
    markDirty(sid);
  }
  const msg = sc===100 ? "완벽해요! 💖" : sc>=80 ? "거의 다 왔어요! ✨" : sc>=50 ? "좋아요, 조금만 더! 🌱" : "괜찮아요, 다시 해봐요 🍀";
  let html = '<div class="panel"><div class="score"><div class="n pop">'+sc+'</div><div style="color:var(--soft)">'+quiz.score+' / '+total+' 맞힘</div><h3 style="font-size:22px;margin-top:10px">'+msg+'</h3>'+(quiz.newBest?'<p class="hint" style="color:var(--cd)">🏆 최고 점수 갱신!</p>':'')+'</div>';
  if(quiz.wrong.length){
    html += '<div class="sec" style="margin-top:8px">다시 볼 카드</div>';
    html += quiz.wrong.map(k=>'<div class="card-item"><div class="tx"><b>'+esc(k.t)+'</b><span>'+esc(k.m)+'</span></div></div>').join("");
  }
  html += '<div class="row" style="margin-top:14px"><button class="pill" style="flex:1" id="again">다시 풀기</button>'+(quiz.wrong.length?'<button class="pill main" style="flex:1" id="tocard">틀린 카드 외우기</button>':'')+'</div></div>';
  body.innerHTML = html;
  body.querySelector("#again").onclick = ()=>{ quiz = buildQuiz(sid, x, quiz.dir); renderQuiz(body, sid, x); };
  const tc = body.querySelector("#tocard");
  if(tc) tc.onclick = ()=>{ quiz=null; view.tab="card"; cardState={idx:0, turned:false, onlyUnknown:true, order:null}; render(); window.scrollTo(0,0); };
}

init();
})();
</script>
</body>
