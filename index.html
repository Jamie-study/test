<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공부콩 · 간호 공부 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF8F1; --paper:#FFFFFF; --ink:#4B3F57; --sub:#8E8399; --line:#F1E6EE;
  --pink:#FFE1EA; --pinkD:#F48FB1; --mint:#D5F4E6; --mintD:#5FC69B;
  --lav:#E9E1FF; --lavD:#9C8BEA; --peach:#FFE7D1; --peachD:#FFA766;
  --good:#5FC69B; --bad:#F28B9B;
  --r:22px; --shadow:0 6px 18px rgba(176,140,170,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:16px;line-height:1.55}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background-image:radial-gradient(circle at 12% 8%,#FFE9F0 0 90px,transparent 91px),radial-gradient(circle at 92% 22%,#E6F7EE 0 70px,transparent 71px);background-attachment:fixed}
button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,.jua{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400;margin:0}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px 40px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:14px 0 10px;background:linear-gradient(var(--cream) 75%,transparent)}
.top h1{font-size:22px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:14px;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px;flex:none}
.iconbtn:active{transform:scale(.94)}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand svg{width:46px;height:40px;flex:none}
.brand small{display:block;font-family:'Gowun Dodum';font-size:12px;color:var(--sub);margin-top:-2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--paper);color:var(--sub);box-shadow:var(--shadow)}
.hello{margin:6px 2px 16px;color:var(--sub);font-size:14px}
.subj{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px;border-radius:var(--r);margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.subj:active{transform:scale(.985)}
.subj .emo{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:28px;flex:none}
.subj h2{font-size:21px}
.subj .meta{font-size:13px;opacity:.8}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px}
.subj .arrow{margin-left:auto;font-size:20px;opacity:.5}
.addline{width:100%;padding:14px;border-radius:var(--r);border:2px dashed #E7D6E2;color:var(--sub);font-size:15px;background:rgba(255,255,255,.5)}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.hero{border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:16px;background:var(--paper);box-shadow:var(--shadow);font-size:15px}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--ink);color:#fff}
.btn.soft{background:rgba(255,255,255,.8)}
.btn.full{width:100%}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45}
.chap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);margin-bottom:10px}
.chap .num{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-family:'Jua';flex:none}
.chap b{font-weight:400;font-family:'Jua';font-size:17px;display:block}
.chap .meta{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:6px;background:var(--paper);padding:5px;border-radius:18px;box-shadow:var(--shadow);margin-bottom:14px;position:sticky;top:64px;z-index:4}
.tabs button{flex:1;padding:10px 4px;border-radius:14px;font-family:'Jua';font-size:16px;color:var(--sub)}
.tabs button.on{color:var(--ink)}
.empty{text-align:center;padding:26px 10px;color:var(--sub)}
.empty svg{width:96px;height:80px;display:block;margin:0 auto 8px}
.sumview{font-size:16px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
.sumview h3{font-size:18px;margin:14px 0 6px;padding:2px 10px;border-radius:10px;display:inline-block}
.sumview h3:first-child{margin-top:0}
.sumview ul{margin:4px 0;padding-left:20px}
.sumview p{margin:4px 0}
.sumview mark{background:linear-gradient(transparent 45%,#FFF0A8 45%);color:inherit;padding:0 2px}
.sumview b{font-weight:700}
textarea,input[type=text]{width:100%;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:#FFFDFB;outline:none}
textarea:focus,input[type=text]:focus{border-color:#E8C6D8}
#sumBox{min-height:46vh;resize:vertical;line-height:1.7}
.hint{font-size:12px;color:var(--sub);margin:8px 2px 0}
.savedot{font-size:12px;color:var(--sub)}
.addform{display:grid;gap:8px}
.termrow{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--paper);border-radius:16px;box-shadow:var(--shadow);margin-bottom:8px;width:100%;text-align:left}
.termrow .t{font-family:'Jua';font-size:16px}
.termrow .m{font-size:14px;color:var(--sub)}
.termrow .ok{margin-left:auto;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--mint);color:#2E7D5B;flex:none}
.termrow .no{margin-left:auto;font-size:12px;padding:3px 8px;border-radius:99px;background:#F5EFF4;color:var(--sub);flex:none}
.sec{font-family:'Jua';font-size:17px;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
.sec span{font-family:'Gowun Dodum';font-size:12px;color:var(--sub)}
/* flip */
.stage{perspective:1200px;margin:8px 0 16px}
.flip{position:relative;width:100%;height:min(58vh,380px);transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--paper)}
.face .big{font-family:'Jua';font-size:clamp(26px,8vw,38px);word-break:keep-all;overflow-wrap:anywhere}
.face .mean{font-size:clamp(18px,5vw,22px);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap}
.face .tag{position:absolute;top:16px;left:18px;font-size:12px;color:var(--sub)}
.face .tap{position:absolute;bottom:16px;font-size:12px;color:var(--sub)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{padding:15px;font-size:16px}
.prog{height:10px;border-radius:99px;background:#F3E9F0;overflow:hidden;margin:4px 0 14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#F7A8C4,#B9A6F5);border-radius:99px;transition:width .3s}
.counter{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
/* quiz */
.qbox{background:var(--paper);border-radius:24px;box-shadow:var(--shadow);padding:20px 18px;margin-bottom:14px}
.qbox .qt{font-size:19px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.qbox .qt b{font-family:'Jua';font-weight:400;font-size:22px}
.qkind{font-size:12px;color:var(--sub);margin-bottom:6px}
.choice{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:16px;background:var(--paper);box-shadow:var(--shadow);margin-bottom:10px;border:2px solid transparent;word-break:keep-all;overflow-wrap:anywhere}
.choice:active{transform:scale(.99)}
.choice.right{border-color:var(--good);background:#EAFBF3}
.choice.wrong{border-color:var(--bad);background:#FFEFF2}
.choice.dim{opacity:.55}
.explain{padding:12px 14px;border-radius:16px;background:#FFF7DD;font-size:14px;margin-bottom:12px;white-space:pre-wrap}
.result{text-align:center;padding:10px 0 6px}
.result .score{font-family:'Jua';font-size:46px}
.wrongitem{padding:12px 14px;border-radius:16px;background:var(--paper);box-shadow:var(--shadow);margin-bottom:8px;font-size:14px}
.wrongitem .a{color:#2E7D5B;margin-top:4px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(75,63,87,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--cream);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s cubic-bezier(.3,1.2,.5,1)}
.sheet h3{font-size:20px;margin-bottom:12px}
.sheet label{display:block;font-size:13px;color:var(--sub);margin:10px 2px 4px}
.sheet .acts{display:flex;gap:8px;margin-top:16px}
.sheet .acts .btn{flex:1}
.btn.danger{background:#FFE3E8;color:#B23A55}
.emogrid{display:flex;flex-wrap:wrap;gap:6px}
.emogrid button{width:42px;height:42px;border-radius:12px;background:var(--paper);font-size:20px;border:2px solid transparent}
.emogrid button.on{border-color:var(--ink)}
.colgrid{display:flex;gap:8px}
.colgrid button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:var(--shadow)}
.colgrid button.on{outline:3px solid var(--ink)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px;border-radius:12px;background:var(--paper);border:2px solid transparent}
.seg button.on{border-color:var(--ink)}
.menu .btn{width:100%;justify-content:flex-start;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;animation:fade .2s;max-width:90vw;text-align:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.pop{animation:pop .4s}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
/* ---------- 기본값 ---------- */
const PALETTE=[
  {bg:'#FFE1EA',deep:'#F48FB1',ink:'#9C3D63'},
  {bg:'#D5F4E6',deep:'#5FC69B',ink:'#2E7D5B'},
  {bg:'#E9E1FF',deep:'#9C8BEA',ink:'#5B4BA8'},
  {bg:'#FFE7D1',deep:'#FFA766',ink:'#A35A1F'},
  {bg:'#DCEEFF',deep:'#7FB6EE',ink:'#2F6AA3'},
  {bg:'#FFF4C4',deep:'#E9C94F',ink:'#8A6D0A'}
];
const EMOJIS=['📖','🫀','🩺','💊','🧠','🦴','🩸','🧪','📝','🌷','⭐','🍀','🐰','🧸'];
const DEFAULT_SUBJECTS=[
  {id:'med',name:'의학용어',emoji:'📖',color:0},
  {id:'anat',name:'해부생리',emoji:'🫀',color:1},
  {id:'fund',name:'기본간호학',emoji:'🩺',color:2}
];
const LS='gongbukong-v1';
const BEAN=(mood)=>`<svg viewBox="0 0 120 100" aria-hidden="true"><path d="M28 22C52 2 96 8 103 40c6 30-18 54-46 50-17-2-19-16-30-22C8 58 6 36 28 22z" fill="#C7E8A6"/><path d="M40 26c10-6 22-6 30-2" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".6"/>${mood==='sad'
 ?'<path d="M44 52q5-4 10 0M70 52q5-4 10 0" stroke="#4B3F57" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M54 70q8-6 16 0" stroke="#4B3F57" stroke-width="3" fill="none" stroke-linecap="round"/>'
 :'<circle cx="49" cy="50" r="4.5" fill="#4B3F57"/><circle cx="75" cy="50" r="4.5" fill="#4B3F57"/><path d="M55 62q7 8 14 0" stroke="#4B3F57" stroke-width="3" fill="none" stroke-linecap="round"/>'}<ellipse cx="38" cy="62" rx="7" ry="4.5" fill="#F7A8C4" opacity=".8"/><ellipse cx="86" cy="62" rx="7" ry="4.5" fill="#F7A8C4" opacity=".8"/></svg>`;

const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pal=s=>PALETTE[(s&&s.color)||0]||PALETTE[0];

/* ---------- 상태 ---------- */
const state={subjects:clone(DEFAULT_SUBJECTS),chapters:{},mode:'local',status:'local'};
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||'null');}catch(e){return null;}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({subjects:state.subjects,chapters:state.chapters}));}catch(e){}}
const boot=lsLoad();
if(boot&&Array.isArray(boot.subjects)&&boot.subjects.length){state.subjects=boot.subjects;state.chapters=boot.chapters||{};}
const ui={editSum:{}};
let session=null;

/* ---------- 저장 (브라우저) ---------- */
function persistChapter(ch){ch.updatedAt=Date.now();state.chapters[ch.id]=ch;lsSave();markSaved();}
function removeChapter(id){delete state.chapters[id];lsSave();}
function persistMeta(){lsSave();}
function markSaving(){const el=document.getElementById('saveDot');if(el)el.textContent='저장 중…';}
function markSaved(){const el=document.getElementById('saveDot');if(el)el.textContent='저장됨 ✓';}
let canStore=true;
try{localStorage.setItem(LS+'-t','1');localStorage.removeItem(LS+'-t');}catch(e){canStore=false;}

/* ---------- 데이터 도우미 ---------- */
const subjOf=id=>state.subjects.find(s=>s.id===id);
const chaptersOf=sid=>Object.values(state.chapters).filter(c=>c.subjectId===sid).sort((a,b)=>(a.order||0)-(b.order||0));
function stats(chs){let cards=0,known=0,qs=0;chs.forEach(c=>{(c.cards||[]).forEach(k=>{cards++;if(k.known)known++;});qs+=(c.quiz||[]).length;});return{cards,known,qs};}
function newChapter(sid,title){
  const list=chaptersOf(sid);
  const ch={id:uid(),subjectId:sid,title:title,order:(list.length?Math.max(...list.map(c=>c.order||0))+1:1),summary:'',cards:[],quiz:[],createdAt:Date.now()};
  persistChapter(ch);return ch;
}

/* ---------- 라우팅 ---------- */
function parseHash(){
  const h=location.hash.replace(/^#/,'');
  let m=h.match(/^s-([a-z0-9]+)(?:-(run|flip))?$/);
  if(m)return{view:m[2]||'subject',sid:m[1],scope:'s'};
  m=h.match(/^c-([a-z0-9]+)-(sum|cards|quiz|flip|run)$/);
  if(m)return{view:(m[2]==='flip'||m[2]==='run')?m[2]:'chapter',cid:m[1],tab:m[2],scope:'c'};
  return{view:'home'};
}
const stack=[location.hash];
window.addEventListener('hashchange',()=>{
  const h=location.hash;
  if(stack.length>1&&stack[stack.length-2]===h)stack.pop();else stack.push(h);
  window.scrollTo(0,0);render();
});
function go(h){if(('#'+h)===location.hash||(h===''&&!location.hash)){render();return;}location.hash=h;}
function back(parent){
  if(stack.length>1)history.back();
  else{location.replace('#'+parent);}
}

/* ---------- 렌더 ---------- */
const $app=document.getElementById('app');
let pendingRender=false;
function safeRender(){
  const a=document.activeElement;
  if(a&&$app.contains(a)&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')){pendingRender=true;return;}
  if(document.querySelector('.ov'))return void(pendingRender=true);
  render();
}
$app.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{if(pendingRender){pendingRender=false;safeRender();}},50);});

function storagePill(){
  return canStore?'<span class="pill">💾 이 브라우저에 저장돼요</span>':'<span class="pill">⚠️ 저장이 안 되는 환경이에요</span>';
}

function render(){
  pendingRender=false;
  const r=parseHash();
  if(r.view==='home')return renderHome();
  if(r.view==='subject'){const s=subjOf(r.sid);if(!s)return location.replace('#');return renderSubject(s);}
  if(r.view==='chapter'){const c=state.chapters[r.cid];if(!c)return location.replace('#');return renderChapter(c,r.tab);}
  if(r.view==='flip'||r.view==='run'){
    const key=location.hash.slice(1);
    if(!session||session.key!==key){
      const parent=r.scope==='c'?('c-'+r.cid+'-'+(r.view==='flip'?'cards':'quiz')):('s-'+r.sid);
      return location.replace('#'+parent);
    }
    return r.view==='flip'?renderFlip():renderQuiz();
  }
}
function renderLoading(){$app.innerHTML=`<div class="empty" style="padding-top:30vh">${BEAN()}<div>불러오는 중…</div></div>`;}

function renderHome(){
  const hour=new Date().getHours();
  const hi=hour<6?'늦은 시간까지 수고 많아요 🌙':hour<12?'좋은 아침이에요 ☀️':hour<18?'오늘도 콩콩 공부해봐요 🌱':'오늘 하루도 고생했어요 🌷';
  let html=`<div class="top"><div class="brand">${BEAN()}<div><h1>공부콩</h1><small>간호 공부 노트</small></div></div>
  <button class="iconbtn" data-act="settings" aria-label="설정">⚙️</button></div>
  <div class="hello">${hi} &nbsp;${storagePill()}</div>`;
  state.subjects.forEach(s=>{
    const p=pal(s),chs=chaptersOf(s.id),st=stats(chs);
    const pct=st.cards?Math.round(st.known/st.cards*100):0;
    html+=`<button class="subj" style="background:${p.bg};color:${p.ink}" data-act="openSubj" data-id="${s.id}">
      <div class="emo">${esc(s.emoji)}</div>
      <div style="flex:1;min-width:0"><h2>${esc(s.name)}</h2>
      <div class="meta">단원 ${chs.length}개 · 카드 ${st.cards}장 · 문제 ${st.qs}개</div>
      <div class="bar"><i style="width:${pct}%;background:${p.deep}"></i></div>
      <div class="meta" style="margin-top:3px">외운 카드 ${pct}%</div></div>
      <span class="arrow">›</span></button>`;
  });
  html+=`<button class="addline" data-act="addSubj">＋ 과목 추가하기</button>`;
  $app.innerHTML=html;
}

function renderSubject(s){
  const p=pal(s),chs=chaptersOf(s.id),st=stats(chs);
  let html=`<div class="top"><button class="iconbtn" data-act="back" data-parent="">‹</button><h1>${esc(s.emoji)} ${esc(s.name)}</h1>
  <button class="iconbtn" data-act="subjMenu" data-id="${s.id}" aria-label="과목 메뉴">⋯</button></div>
  <div class="hero" style="background:${p.bg};color:${p.ink}">
    <div class="jua" style="font-size:18px">과목 전체 복습</div>
    <div style="font-size:13px;opacity:.85">카드 ${st.cards}장 중 ${st.known}장 외웠어요 · 문제 ${st.qs}개</div>
    <div class="row"><button class="btn soft" data-act="flipSubj" data-id="${s.id}" ${st.cards?'':'disabled'}>🃏 전체 카드</button>
    <button class="btn soft" data-act="quizSubj" data-id="${s.id}" ${st.cards+st.qs?'':'disabled'}>✏️ 전체 퀴즈</button></div>
  </div>
  <div class="sec">단원 <span>${chs.length}개</span></div>`;
  if(!chs.length){
    html+=`<div class="empty">${BEAN()}<div>아직 단원이 없어요.<br>첫 단원을 만들어볼까요?</div></div>`;
  }
  chs.forEach((c,i)=>{
    const cs=stats([c]);
    html+=`<button class="chap" data-act="openChap" data-id="${c.id}">
      <div class="num" style="background:${p.bg};color:${p.ink}">${i+1}</div>
      <div style="flex:1;min-width:0"><b>${esc(c.title)}</b>
      <div class="meta">${c.summary&&c.summary.trim()?'요약 ✓':'요약 없음'} · 카드 ${cs.cards}장 · 문제 ${cs.qs}개${c.lastQuiz?` · 최근 퀴즈 ${c.lastQuiz.score}/${c.lastQuiz.total}`:''}</div></div>
      <span style="opacity:.4">›</span></button>`;
  });
  html+=`<button class="addline" data-act="addChap" data-id="${s.id}">＋ 단원 추가하기</button>`;
  $app.innerHTML=html;
}

function fmtSummary(t){
  const lines=esc(t).split('\n');let out='',inList=false;
  const inline=x=>x.replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  lines.forEach(l=>{
    const li=l.match(/^\s*[-•·*]\s+(.*)$/);
    if(li){if(!inList){out+='<ul>';inList=true;}out+='<li>'+inline(li[1])+'</li>';return;}
    if(inList){out+='</ul>';inList=false;}
    const h=l.match(/^#+\s*(.*)$/);
    if(h){out+='<h3 class="hd">'+inline(h[1])+'</h3>';return;}
    out+=l.trim()?'<p>'+inline(l)+'</p>':'<div style="height:8px"></div>';
  });
  if(inList)out+='</ul>';
  return out;
}

/* ---------- 카드 외우기 ---------- */
function startFlip(scope,id,onlyUnknown){
  const chs=scope==='c'?[state.chapters[id]]:chaptersOf(id);
  let items=[];
  chs.forEach(c=>(c.cards||[]).forEach(k=>{if(!onlyUnknown||!k.known)items.push({cid:c.id,kid:k.id});}));
  if(!items.length)return toast('외울 카드가 없어요');
  const key=(scope==='c'?'c-'+id:'s-'+id)+'-flip';
  session={type:'flip',key,scope,id,items:shuffle(items),idx:0,flipped:false,know:0,dont:0,missed:[]};
  go(key);
}
function findCard(it){const c=state.chapters[it.cid];return c&&(c.cards||[]).find(k=>k.id===it.kid);}
function renderFlip(){
  const S=session,s=S.scope==='c'?subjOf(state.chapters[S.id]?.subjectId):subjOf(S.id),p=pal(s);
  const parent=S.scope==='c'?'c-'+S.id+'-cards':'s-'+S.id;
  let html=`<div class="top"><button class="iconbtn" data-act="back" data-parent="${parent}">✕</button><h1>카드 외우기</h1></div>`;
  if(S.idx>=S.items.length){
    const all=S.know+S.dont;
    html+=`<div class="result pop">${BEAN(S.dont>S.know?'sad':'')}
      <div class="score">${S.know} / ${all}</div>
      <div>${S.dont===0?'전부 알았어요! 최고예요 🎉':S.know>=S.dont?'잘하고 있어요! 몇 장만 더 보면 돼요':'괜찮아요, 반복하면 외워져요 💪'}</div></div>
      <div style="display:grid;gap:10px;margin-top:20px">
      ${S.missed.length?`<button class="btn main full" data-act="flipAgain">😵 몰랐던 ${S.missed.length}장 다시 보기</button>`:''}
      <button class="btn full" data-act="flipRestart">🔄 처음부터 다시</button>
      <button class="btn full" data-act="back" data-parent="${parent}">끝내기</button></div>`;
    $app.innerHTML=html;return;
  }
  const k=findCard(S.items[S.idx]);
  if(!k){S.items.splice(S.idx,1);return renderFlip();}
  const cn=state.chapters[S.items[S.idx].cid];
  html+=`<div class="counter"><span>${S.idx+1} / ${S.items.length}</span><span>😊 ${S.know} · 😵 ${S.dont}</span></div>
  <div class="prog"><i style="width:${S.idx/S.items.length*100}%"></i></div>
  <div class="stage"><div class="flip ${S.flipped?'on':''}" data-act="flip">
    <div class="face" style="background:${p.bg};color:${p.ink}">${S.scope==='s'?`<span class="tag">${esc(cn?cn.title:'')}</span>`:''}<div class="big">${esc(k.term)}</div><span class="tap">눌러서 뒤집기</span></div>
    <div class="face back"><div class="mean">${esc(k.meaning)}</div><span class="tap">눌러서 다시 앞면</span></div>
  </div></div>
  <div class="two"><button class="btn" data-act="mark" data-v="0">😵 몰라요</button><button class="btn main" data-act="mark" data-v="1">😊 알아요</button></div>
  <div class="hint" style="text-align:center;margin-top:12px">먼저 뜻을 떠올려본 다음 뒤집어서 확인해봐요</div>`;
  $app.innerHTML=html;
}
function markCard(v){
  const S=session,it=S.items[S.idx],c=state.chapters[it.cid];
  if(c){const k=(c.cards||[]).find(x=>x.id===it.kid);if(k&&!!k.known!==!!v){k.known=!!v;persistChapter(c);}}
  if(v)S.know++;else{S.dont++;S.missed.push(it);}
  S.idx++;S.flipped=false;renderFlip();
}

/* ---------- 퀴즈 ---------- */
function cardQuestions(chs,pool){
  const terms=[...new Set(pool.map(k=>k.term))],means=[...new Set(pool.map(k=>k.meaning))];
  const out=[];
  chs.forEach(c=>(c.cards||[]).forEach(k=>{
    const dir=Math.random()<.5;
    const ans=dir?k.meaning:k.term;
    const others=shuffle((dir?means:terms).filter(x=>x!==ans)).slice(0,3);
    if(!others.length)return;
    const choices=shuffle([ans,...others]);
    out.push({kind:'용어 카드',text:dir?`<b>${esc(k.term)}</b><br>의 뜻은?`:`뜻이 <b style="font-size:19px">“${esc(k.meaning)}”</b> 인 용어는?`,
      plain:dir?`${k.term} 의 뜻은?`:`뜻이 “${k.meaning}” 인 용어는?`,choices,correct:choices.indexOf(ans),explain:`${k.term} = ${k.meaning}`,cid:c.id});
  }));
  return out;
}
function myQuestions(chs){
  const out=[];
  chs.forEach(c=>(c.quiz||[]).forEach(q=>{
    const choices=shuffle([q.answer,...(q.wrongs||[]).filter(Boolean)]);
    out.push({kind:'내가 만든 문제',text:esc(q.q).replace(/\n/g,'<br>'),plain:q.q,choices,correct:choices.indexOf(q.answer),explain:q.explain||'',cid:c.id});
  }));
  return out;
}
function startQuiz(scope,id,src){
  const chs=scope==='c'?[state.chapters[id]]:chaptersOf(id);
  const sid=scope==='c'?chs[0].subjectId:id;
  let pool=[];chaptersOf(sid).forEach(c=>pool.push(...(c.cards||[])));
  if(new Set(pool.map(k=>k.meaning)).size<4){pool=[];Object.values(state.chapters).forEach(c=>pool.push(...(c.cards||[])));}
  let qs=[];
  if(src!=='mine')qs.push(...cardQuestions(chs,pool));
  if(src!=='cards')qs.push(...myQuestions(chs));
  if(!qs.length)return toast(src==='cards'?'용어 카드가 2장 이상 있어야 퀴즈를 만들 수 있어요':'풀 문제가 없어요');
  const key=(scope==='c'?'c-'+id:'s-'+id)+'-run';
  session={type:'quiz',key,scope,id,src,qs:shuffle(qs),idx:0,picked:null,right:0,wrongs:[]};
  go(key);
}
function renderQuiz(){
  const S=session,parent=S.scope==='c'?'c-'+S.id+'-quiz':'s-'+S.id;
  let html=`<div class="top"><button class="iconbtn" data-act="back" data-parent="${parent}">✕</button><h1>퀴즈</h1></div>`;
  if(S.idx>=S.qs.length){
    const n=S.qs.length,pct=Math.round(S.right/n*100);
    html+=`<div class="result pop">${BEAN(pct<50?'sad':'')}<div class="score">${S.right} / ${n}</div>
    <div>${pct===100?'만점이에요! 완벽해요 🎉':pct>=80?'거의 다 맞혔어요! 👏':pct>=50?'절반 넘게 맞혔어요. 틀린 것만 다시 봐요':'괜찮아요, 틀린 문제가 진짜 공부예요 💪'}</div></div>`;
    if(S.wrongs.length){
      html+=`<div class="sec">틀린 문제 <span>${S.wrongs.length}개</span></div>`;
      S.wrongs.forEach(w=>{html+=`<div class="wrongitem"><div>${esc(w.plain)}</div><div class="a">정답: ${esc(w.choices[w.correct])}</div>${w.explain&&w.kind!=='용어 카드'?`<div class="m" style="color:var(--sub);margin-top:4px">${esc(w.explain)}</div>`:''}</div>`;});
    }
    html+=`<div style="display:grid;gap:10px;margin-top:16px">
    ${S.wrongs.length?`<button class="btn main full" data-act="quizWrong">❗ 틀린 것만 다시 풀기</button>`:''}
    <button class="btn full" data-act="quizRestart">🔄 다시 풀기</button>
    <button class="btn full" data-act="back" data-parent="${parent}">끝내기</button></div>`;
    $app.innerHTML=html;return;
  }
  const q=S.qs[S.idx],done=S.picked!==null;
  html+=`<div class="counter"><span>${S.idx+1} / ${S.qs.length}</span><span>맞힌 문제 ${S.right}</span></div>
  <div class="prog"><i style="width:${S.idx/S.qs.length*100}%"></i></div>
  <div class="qbox"><div class="qkind">${q.kind}</div><div class="qt">${q.text}</div></div>`;
  q.choices.forEach((ch,i)=>{
    let cls='choice';
    if(done){if(i===q.correct)cls+=' right';else if(i===S.picked)cls+=' wrong';else cls+=' dim';}
    html+=`<button class="${cls}" data-act="pick" data-i="${i}" ${done?'disabled':''}>${done&&i===q.correct?'⭕ ':done&&i===S.picked?'❌ ':''}${esc(ch)}</button>`;
  });
  if(done){
    if(q.explain&&q.kind!=='용어 카드')html+=`<div class="explain">💡 ${esc(q.explain)}</div>`;
    html+=`<button class="btn main full" data-act="nextQ">${S.idx+1<S.qs.length?'다음 문제 →':'결과 보기'}</button>`;
  }
  $app.innerHTML=html;
}
function pick(i){
  const S=session,q=S.qs[S.idx];if(S.picked!==null)return;
  S.picked=i;if(i===q.correct)S.right++;else S.wrongs.push(q);
  renderQuiz();
}
function nextQ(){
  const S=session;S.idx++;S.picked=null;
  if(S.idx>=S.qs.length&&S.scope==='c'&&S.src==='all'&&!S.retry){
    const c=state.chapters[S.id];if(c){c.lastQuiz={score:S.right,total:S.qs.length,at:Date.now()};persistChapter(c);}
  }
  renderQuiz();window.scrollTo(0,0);
}

/* ---------- 시트(모달) ---------- */
function sheet({title,body,ok='확인',danger=false,onOk,onOpen,noCancel=false}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<form class="sheet"><h3>${title}</h3>${body}<div class="acts">${noCancel?'':'<button type="button" class="btn" data-x>취소</button>'}${ok?`<button type="submit" class="btn ${danger?'danger':'main'}">${ok}</button>`:''}</div></form>`;
  const form=ov.querySelector('form');
  const close=()=>{ov.remove();if(pendingRender)safeRender();};
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-x]'))close();});
  form.addEventListener('submit',e=>{e.preventDefault();if(!onOk||onOk(form)!==false)close();});
  document.body.appendChild(ov);
  if(onOpen)onOpen(form,close);
  const f=form.querySelector('input[type=text],textarea');if(f)setTimeout(()=>f.focus(),60);
  return close;
}
function confirmSheet(title,msg,okText,fn){sheet({title,body:`<p style="margin:0;color:var(--sub)">${msg}</p>`,ok:okText,danger:true,onOk:()=>{fn();}});}

function questionSheet(c,q){

  const w=i=>esc((q.wrongs||[])[i]||'');
  sheet({title:isNew?'문제 만들기':'문제 고치기',ok:'저장',
    body:`<div class="seg"><button type="button" data-t="mc" class="${ox?'':'on'}">객관식</button><button type="button" data-t="ox" class="${ox?'on':''}">O / X</button></div>
    <label>문제</label><textarea name="q" rows="3" required placeholder="예: 성인의 정상 맥박수 범위는?">${esc(q.q)}</textarea>
    <div data-mc style="${ox?'display:none':''}">
      <label>정답</label><input type="text" name="answer" value="${ox?'':esc(q.answer)}" placeholder="정답 보기">
      <label>오답 보기 (1개 이상)</label>
      <div style="display:grid;gap:6px"><input type="text" name="w0" value="${ox?'':w(0)}" placeholder="오답 1"><input type="text" name="w1" value="${ox?'':w(1)}" placeholder="오답 2 (선택)"><input type="text" name="w2" value="${ox?'':w(2)}" placeholder="오답 3 (선택)"></div>
    </div>
    <div data-ox style="${ox?'':'display:none'}"><label>정답</label><div class="seg"><button type="button" data-o="O" class="${q.answer!=='X'?'on':''}">⭕ O</button><button type="button" data-o="X" class="${q.answer==='X'?'on':''}">❌ X</button></div></div>
    <label>해설 (선택)</label><textarea name="explain" rows="2" placeholder="왜 그런지 한 줄로 적어두면 좋아요">${esc(q.explain)}</textarea>
    ${isNew?'':'<button type="button" class="btn danger full" style="margin-top:14px" data-del>🗑 이 문제 지우기</button>'}`,
    onOpen:(f,close)=>{let oxAns=q.answer==='X'?'X':'O';f.dataset.ox=ox?'1':'0';f.dataset.oa=oxAns;
      f.addEventListener('click',e=>{
        const t=e.target.closest('[data-t]');if(t){ox=t.dataset.t==='ox';f.dataset.ox=ox?'1':'0';f.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b===t));f.querySelector('[data-mc]').style.display=ox?'none':'';f.querySelector('[data-ox]').style.display=ox?'':'none';}
        const o=e.target.closest('[data-o]');if(o){f.dataset.oa=o.dataset.o;f.querySelectorAll('[data-o]').forEach(b=>b.classList.toggle('on',b===o));}
        if(e.target.closest('[data-del]')){c.quiz=(c.quiz||[]).filter(x=>x.id!==q.id);persistChapter(c);close();render();toast('문제를 지웠어요');}
      });},
    onOk:f=>{
      const text=f.q.value.trim();if(!text){toast('문제를 적어주세요');return false;}
      q.q=text;q.explain=f.explain.value.trim();
      if(f.dataset.ox==='1'){q.answer=f.dataset.oa;q.wrongs=[q.answer==='O'?'X':'O'];}
      else{const a=f.answer.value.trim(),ws=[f.w0.value,f.w1.value,f.w2.value].map(x=>x.trim()).filter(Boolean);
        if(!a){toast('정답을 적어주세요');return false;}if(!ws.length){toast('오답 보기를 1개 이상 적어주세요');return false;}
        q.answer=a;q.wrongs=ws;}
      c.quiz=c.quiz||[];const i=c.quiz.findIndex(x=>x.id===q.id);if(i>=0)c.quiz[i]=q;else c.quiz.push(q);
      persistChapter(c);render();toast(isNew?'문제를 추가했어요':'저장했어요');
    }
  });
}
function settingsSheet(){
  const mode='💾 내용은 이 기기의 이 브라우저에만 저장돼요. 브라우저 기록을 지우면 사라질 수 있으니 가끔 백업해두세요.';
  sheet({title:'설정 · 백업',ok:'',body:`<p style="margin:0 0 12px;font-size:14px;color:var(--sub)">${mode}</p>
    <div class="menu"><button type="button" class="btn" data-copy>📋 백업 내용 복사하기</button>
    <button type="button" class="btn" data-imp>📥 백업 붙여넣어 되살리기</button></div>
    <p class="hint">복사한 백업은 메모장이나 카톡 나에게 보내기에 붙여두면 안전해요.</p>`,
    onOpen:(f,close)=>{f.addEventListener('click',async e=>{
      if(e.target.closest('[data-copy]')){
        const txt=JSON.stringify({app:'gongbukong',v:1,subjects:state.subjects,chapters:Object.values(state.chapters)});
        try{await navigator.clipboard.writeText(txt);toast('백업 내용을 복사했어요');}
        catch(err){close();sheet({title:'백업 내용',ok:'',body:`<p class="hint" style="margin-top:0">자동 복사가 안 돼서, 아래 글을 길게 눌러 전체 선택 후 복사해주세요.</p><textarea rows="8" readonly>${esc(txt)}</textarea>`});}
      }
      if(e.target.closest('[data-imp]')){close();importSheet();}
    });}
  });
}
function importSheet(){
  sheet({title:'백업 되살리기',ok:'되살리기',danger:true,
    body:`<p class="hint" style="margin-top:0">복사해둔 백업 글을 붙여넣어주세요. 지금 내용은 백업 내용으로 바뀌어요.</p><textarea name="t" rows="8" required></textarea>`,
    onOk:f=>{
      let d;try{d=JSON.parse(f.t.value);}catch(e){toast('백업 글이 아닌 것 같아요');return false;}
      if(!d||d.app!=='gongbukong'||!Array.isArray(d.subjects)||!Array.isArray(d.chapters)){toast('백업 글이 아닌 것 같아요');return false;}
      Object.keys(state.chapters).forEach(id=>{if(!d.chapters.find(c=>c.id===id))removeChapter(id);});
      state.subjects=d.subjects;persistMeta();
      d.chapters.forEach(c=>{if(c&&c.id&&/^[a-z0-9]+$/.test(c.id))persistChapter(c);});
      location.replace('#');render();toast('되살렸어요');
    }
  });
}

/* ---------- 이벤트 ---------- */
const A={
  back:t=>back(t.dataset.parent||''),
  settings:()=>settingsSheet(),
  openSubj:t=>go('s-'+t.dataset.id),
  addSubj:()=>subjectSheet(null),
  subjMenu:t=>{const s=subjOf(t.dataset.id);
    sheet({title:esc(s.name),ok:'',body:`<div class="menu"><button type="button" class="btn" data-edit>✏️ 이름·아이콘·색 바꾸기</button><button type="button" class="btn danger" data-del>🗑 과목 지우기</button></div>`,
      onOpen:(f,close)=>f.addEventListener('click',e=>{
        if(e.target.closest('[data-edit]')){close();subjectSheet(s);}
        if(e.target.closest('[data-del]')){close();const n=chaptersOf(s.id).length;
          confirmSheet('과목을 지울까요?',`'${esc(s.name)}' 과목과 단원 ${n}개가 모두 지워져요. 되돌릴 수 없어요.`,'지우기',()=>{
            chaptersOf(s.id).forEach(c=>removeChapter(c.id));state.subjects=state.subjects.filter(x=>x.id!==s.id);persistMeta();location.replace('#');toast('과목을 지웠어요');});}
      })});},
  addChap:t=>{const sid=t.dataset.id,n=chaptersOf(sid).length+1;
    sheet({title:'새 단원',ok:'만들기',body:`<label>단원 이름</label><input type="text" name="t" maxlength="40" placeholder="예: ${n}단원 심혈관계" required>`,
      onOk:f=>{const v=f.t.value.trim();if(!v)return false;const ch=newChapter(sid,v);go('c-'+ch.id+'-sum');}});},
  openChap:t=>go('c-'+t.dataset.id+'-sum'),
  chapMenu:t=>{const c=state.chapters[t.dataset.id];
    sheet({title:esc(c.title),ok:'',body:`<div class="menu"><button type="button" class="btn" data-ren>✏️ 단원 이름 바꾸기</button><button type="button" class="btn" data-reset>🔄 카드 '외웠어요' 표시 모두 지우기</button><button type="button" class="btn danger" data-del>🗑 단원 지우기</button></div>`,
      onOpen:(f,close)=>f.addEventListener('click',e=>{
        if(e.target.closest('[data-ren]')){close();sheet({title:'단원 이름',ok:'저장',body:`<input type="text" name="t" value="${esc(c.title)}" maxlength="40" required>`,onOk:g=>{const v=g.t.value.trim();if(!v)return false;c.title=v;persistChapter(c);render();}});}
        if(e.target.closest('[data-reset]')){close();(c.cards||[]).forEach(k=>k.known=false);persistChapter(c);render();toast('처음부터 다시 외워봐요');}
        if(e.target.closest('[data-del]')){close();confirmSheet('단원을 지울까요?',`'${esc(c.title)}'의 요약, 카드, 문제가 모두 지워져요. 되돌릴 수 없어요.`,'지우기',()=>{const sid=c.subjectId;removeChapter(c.id);location.replace('#s-'+sid);toast('단원을 지웠어요');});}
      })});},
  tab:t=>location.replace('#c-'+t.dataset.id+'-'+t.dataset.tab),
  editSum:t=>{ui.editSum[t.dataset.id]=true;render();const b=document.getElementById('sumBox');if(b){b.focus();b.setSelectionRange(b.value.length,b.value.length);}},
  delSum:t=>{const c=state.chapters[t.dataset.id];confirmSheet('요약을 지울까요?','이 단원에 쓴 요약이 모두 지워져요. 되돌릴 수 없어요.','지우기',()=>{c.summary='';persistChapter(c);ui.editSum[c.id]=false;render();toast('요약을 지웠어요');});},
  doneSum:t=>{flushSum();ui.editSum[t.dataset.id]=false;render();window.scrollTo(0,0);},
  editCard:t=>{const c=state.chapters[t.dataset.id],k=c.cards.find(x=>x.id===t.dataset.k);if(k)cardSheet(c,k);},
  flipChap:t=>startFlip('c',t.dataset.id,t.dataset.only==='1'),
  flipSubj:t=>startFlip('s',t.dataset.id,false),
  flip:()=>{session.flipped=!session.flipped;document.querySelector('.flip').classList.toggle('on',session.flipped);},
  mark:t=>markCard(t.dataset.v==='1'),
  flipAgain:()=>{const S=session;S.items=shuffle(S.missed);S.missed=[];S.idx=0;S.know=0;S.dont=0;S.flipped=false;renderFlip();},
  flipRestart:()=>{const S=session;S.items=shuffle(S.items);S.missed=[];S.idx=0;S.know=0;S.dont=0;S.flipped=false;renderFlip();},
  quizChap:t=>startQuiz('c',t.dataset.id,t.dataset.src),
  quizSubj:t=>startQuiz('s',t.dataset.id,'all'),
  addQ:t=>questionSheet(state.chapters[t.dataset.id],null),
  editQ:t=>{const c=state.chapters[t.dataset.id],q=(c.quiz||[]).find(x=>x.id===t.dataset.k);if(q)questionSheet(c,q);},
  pick:t=>pick(+t.dataset.i),
  nextQ:()=>nextQ(),
  quizWrong:()=>{const S=session;S.qs=shuffle(S.wrongs.map(q=>{const ans=q.choices[q.correct],ch=shuffle(q.choices);return Object.assign({},q,{choices:ch,correct:ch.indexOf(ans)});}));S.wrongs=[];S.idx=0;S.right=0;S.picked=null;S.retry=true;renderQuiz();},
  quizRestart:()=>{const S=session;S.qs=shuffle(S.qs);S.wrongs=[];S.idx=0;S.right=0;S.picked=null;S.retry=false;renderQuiz();}
};
$app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=A[t.dataset.act];if(f)f(t,e);});
$app.addEventListener('submit',e=>{
  const f=e.target;if(f.dataset.form!=='addCard')return;e.preventDefault();
  const c=state.chapters[f.dataset.id],term=f.term.value.trim(),meaning=f.meaning.value.trim();
  if(!term||!meaning)return;
  c.cards=c.cards||[];c.cards.push({id:uid(),term,meaning,known:false});persistChapter(c);
  render();toast('카드를 추가했어요 🃏');const ti=document.getElementById('cardTerm');if(ti)ti.focus();
});
let sumT=null,sumCh=null;
function flushSum(){if(sumT){clearTimeout(sumT);sumT=null;if(sumCh)persistChapter(sumCh);}}
$app.addEventListener('input',e=>{
  if(e.target.id!=='sumBox')return;
  const c=state.chapters[e.target.dataset.id];if(!c)return;
  c.summary=e.target.value;sumCh=c;markSaving();
  clearTimeout(sumT);sumT=setTimeout(()=>{sumT=null;persistChapter(c);},800);
});
window.addEventListener('pagehide',flushSum);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSum();});

render();
})();
</script>
</body>
</html>
